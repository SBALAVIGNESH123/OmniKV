name: OmniKV CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: omnikv-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@stable
    - uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
    - name: Build library
      run: cargo build -p omnikv-engine --lib --locked
    - name: Build binary
      run: cargo build -p omnikv-server --release --locked
    - name: Build all targets
      run: cargo build --workspace --all-targets --locked

  test-storage:
    name: Storage Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@stable
    - uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
    - name: Storage tests (76 tests)
      run: cargo test -p omnikv-engine --test storage_tests --locked -- --test-threads=1
    - name: Storage core unit tests
      run: cargo test -p omnikv-engine storage::core::tests --lib --locked -- --test-threads=1
    - name: Storage correctness (14 tests)
      run: cargo test -p omnikv-engine --test storage_correctness --locked -- --test-threads=1
    - name: Storage engine (20 tests)
      run: cargo test -p omnikv-engine --test storage_engine --locked -- --test-threads=1
    - name: Backup/restore contract
      run: cargo test -p omnikv-engine --test backup_restore --locked -- --test-threads=1
    - name: Compaction and reopen regression tests
      run: |
        cargo test -p omnikv-engine --test compaction_regression --locked -- --test-threads=1
        cargo test -p omnikv-engine --test compaction_many_records_regression --locked -- --test-threads=1
        cargo test -p omnikv-engine --test reopen_regression --locked -- --test-threads=1
    - name: Storage performance smoke (21 tests)
      run: cargo test -p omnikv-engine --test storage_perf --locked -- --test-threads=1 --nocapture

  test-transactions:
    name: Transaction & Concurrency Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@stable
    - uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
    - name: SSI anomaly demonstration tests (4 tests)
      run: cargo test -p omnikv-engine --test anomaly_demos --locked -- --test-threads=1
    - name: Concurrent stress tests (6 tests)
      run: cargo test -p omnikv-engine --test concurrent_stress --locked -- --test-threads=1 --nocapture
    - name: Operations (25 tests)
      run: cargo test -p omnikv-engine --test operations --locked -- --test-threads=1

  test-sql:
    name: SQL & Ops Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@stable
    - uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
    - name: SQL layer (20 tests)
      run: cargo test -p omnikv-engine --test sql_layer --locked -- --test-threads=1
    - name: SQL correctness regression batch
      run: cargo test -p omnikv-engine --test sql_correctness_batch --locked -- --test-threads=1
    - name: SHOW TABLES catalog integrity regressions
      run: cargo test -p omnikv-engine --test show_tables_errors --locked -- --test-threads=1
    - name: SQL maturity matrix
      run: cargo test -p omnikv-engine --test sql_maturity_matrix --locked -- --test-threads=1
    - name: SQL v3 feature coverage
      run: cargo test -p omnikv-engine --test sql_v3_features --locked -- --test-threads=1
    - name: Ops maturity (24 tests)
      run: cargo test -p omnikv-engine --test ops_maturity --locked -- --test-threads=1 --nocapture

  test-api-contract:
    name: API & Client Contract Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@stable
    - uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
    - name: REST API response contracts
      run: cargo test -p omnikv-server rest_contract --locked -- --test-threads=1
    - name: PgWire protocol frame contracts
      run: cargo test -p omnikv-engine pgwire_contract --lib --locked -- --test-threads=1
    - name: PgWire libpq compatibility (real sockets)
      run: cargo test -p omnikv-engine --test pgwire_compat --locked -- --test-threads=1
    - name: Rust client smoke contracts
      run: cargo test -p omni-client client_contract --locked -- --test-threads=1

  python-embedded-bridge:
    name: Python Embedded Bridge
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@stable
    - uses: actions/setup-python@v6
      with:
        python-version: "3.12"
    - uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-python-bridge-${{ hashFiles('**/Cargo.lock') }}
    - name: Build Python bridge crate
      run: cargo check -p omnikv-python --locked
    - name: Install Python bridge
      run: |
        python -m pip install pytest
        python -m pip install ./bindings/python
    - name: Run Python bridge contract tests
      run: python -m pytest bindings/python/tests -q

  fuzz-property:
    name: Fuzz Smoke & Property Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@stable
    - uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
          fuzz/target
        key: ${{ runner.os }}-cargo-fuzz-property-${{ hashFiles('**/Cargo.lock', 'fuzz/Cargo.toml') }}
    - name: Build cargo-fuzz targets
      run: cargo check --manifest-path fuzz/Cargo.toml --bins --locked
    - name: Storage property tests
      run: cargo test -p omnikv-engine --test property_storage --locked -- --test-threads=1
    - name: Fuzz corpus regression smoke
      run: |
        cargo test -p omnikv-engine --test fuzz_regressions --locked -- --test-threads=1
        cargo test -p omnikv-server --test fuzz_api_regressions --locked -- --test-threads=1

  test-raft:
    name: Raft Consensus Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@stable
    - uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
    - name: Raft cluster (58 tests)
      run: cargo test -p omnikv-engine --test raft_cluster --locked -- --test-threads=1
    - name: Multi-process cluster failover (kill the leader)
      run: cargo test -p omnikv-server --test cluster_multiprocess --locked -- --test-threads=1

  clippy:
    name: Clippy Lint (All Targets)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy
    - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  benchmark-smoke:
    name: Benchmark Smoke
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@stable
    - uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
    - name: Benchmark suite smoke test
      run: cargo test -p omnikv-engine --test benchmarks --release --locked -- --test-threads=1 --nocapture
    - name: Reproducible benchmark JSON smoke
      run: cargo bench -p omnikv-engine --bench reproducible_bench --locked -- --profile smoke --json-out target/omnikv-benchmark-smoke.json
    - name: Upload benchmark smoke artifact
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: omnikv-benchmark-smoke
        path: target/omnikv-benchmark-smoke.json

  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt
    - run: cargo fmt --all -- --check

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@stable
    - name: Install cargo-audit
      run: cargo install cargo-audit --locked
    - run: cargo audit --deny warnings
    - name: Audit fuzz workspace lockfile
      run: cargo audit --deny warnings
      working-directory: fuzz

  docker:
    name: Docker Image Build and Compose Smoke
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
    - name: Build Docker image
      run: docker build --pull --tag omnikv:ci .
    - name: Docker Compose write/read/restart smoke
      env:
        OMNIKV_IMAGE: omnikv:ci
        OMNIKV_SMOKE_BUILD: "false"
      run: bash scripts/docker-compose-smoke.sh
    - name: Docker Compose 3-node cluster failover smoke
      env:
        OMNIKV_IMAGE: omnikv:ci
        OMNIKV_SMOKE_BUILD: "false"
        OMNIKV_SMOKE_PROJECT: omnikv-cluster-smoke
      run: bash scripts/cluster-compose-smoke.sh
