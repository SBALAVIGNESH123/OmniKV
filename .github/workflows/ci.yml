name: OmniKV CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

concurrency:
  group: omnikv-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@stable
    - uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
    - name: Build library
      run: cargo build -p omnikv-engine --lib
    - name: Build binary
      run: cargo build -p omnikv-server --release
    - name: Build all targets
      run: cargo build --workspace --all-targets

  test-storage:
    name: Storage Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@stable
    - uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
    - name: Storage tests (76 tests)
      run: cargo test -p omnikv-engine --test storage_tests -- --test-threads=1
    - name: Storage correctness (14 tests)
      run: cargo test -p omnikv-engine --test storage_correctness -- --test-threads=1
    - name: Storage engine (19 tests)
      run: cargo test -p omnikv-engine --test storage_engine -- --test-threads=1
    - name: Backup/restore contract
      run: cargo test -p omnikv-engine --test backup_restore -- --test-threads=1
    - name: Storage perf (21 tests)
      run: cargo test -p omnikv-engine --test storage_perf -- --test-threads=1 --nocapture

  test-transactions:
    name: Transaction & Concurrency Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@stable
    - uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
    - name: SSI anomaly demos (4 tests)
      run: cargo test -p omnikv-engine --test anomaly_demos -- --test-threads=1
    - name: Concurrent stress tests (6 tests)
      run: cargo test -p omnikv-engine --test concurrent_stress -- --test-threads=1 --nocapture
    - name: Operations (25 tests)
      run: cargo test -p omnikv-engine --test operations -- --test-threads=1

  test-sql:
    name: SQL & Ops Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@stable
    - uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
    - name: SQL layer (18 tests)
      run: cargo test -p omnikv-engine --test sql_layer -- --test-threads=1
    - name: SQL v3 feature coverage
      run: cargo test -p omnikv-engine --test sql_v3_features -- --test-threads=1
    - name: Ops maturity (24 tests)
      run: cargo test -p omnikv-engine --test ops_maturity -- --test-threads=1 --nocapture

  test-api-contract:
    name: API & Client Contract Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@stable
    - uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
    - name: REST API response contracts
      run: cargo test -p omnikv-server rest_contract -- --test-threads=1
    - name: PgWire protocol frame contracts
      run: cargo test -p omnikv-engine pgwire_contract --lib -- --test-threads=1
    - name: Rust client smoke contracts
      run: cargo test -p omni-client client_contract -- --test-threads=1

  test-raft:
    name: Raft Consensus Tests
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@stable
    - uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
    - name: Raft cluster (58 tests)
      run: cargo test -p omnikv-engine --test raft_cluster -- --test-threads=1

  clippy:
    name: Clippy Lint (All Targets)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy
    - run: cargo clippy --workspace --all-targets -- -D warnings

  benchmark-smoke:
    name: Benchmark Smoke
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@stable
    - uses: actions/cache@v5
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
    - name: Benchmark suite smoke test
      run: cargo test -p omnikv-engine --test benchmarks --release -- --test-threads=1 --nocapture

  fmt:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt
    - run: cargo fmt --all -- --check

  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@stable
    - name: Install cargo-audit
      run: cargo install cargo-audit --locked
    - run: cargo audit --deny warnings

  docker:
    name: Docker Image Build
    runs-on: ubuntu-latest
    needs: build
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
    - run: docker build --pull --tag omnikv:ci .
