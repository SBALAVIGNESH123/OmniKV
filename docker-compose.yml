x-omnikv-common-env: &omnikv-common-env
  OMNIKV_HTTP_ADDR: "0.0.0.0:8443"
  OMNIKV_QUIC_ADDR: "0.0.0.0:4433"
  OMNIKV_PGWIRE_ADDR: "0.0.0.0:5433"
  # The TCP command interface is a plaintext, unrestricted read/write
  # path into the whole database . It is JWT-gated, but it is
  # still not something to publish to the host network: REST (8443) and
  # PgWire (5433) cover every documented use case. It stays loopback-only
  # inside the container, reachable via `docker exec` for debugging.
  OMNIKV_TCP_ADDR: "127.0.0.1:7072"
  OMNIKV_BACKUP_DIR: "/data/backups"
  # Set true only for local demos with generated self-signed certificates.
  # Production deployments should provide trusted TLS material in omnikv.toml.
  OMNIKV_TLS_INSECURE_SKIP: "${OMNIKV_TLS_INSECURE_SKIP:?set OMNIKV_TLS_INSECURE_SKIP=false for production, or true only for a local demo}"
  # Compose validates presence only; OmniKV validates minimum length and uniqueness at startup.
  OMNIKV_JWT_SECRET: "${OMNIKV_JWT_SECRET:?set OMNIKV_JWT_SECRET to a strong 32+ character value}"
  OMNIKV_BOOTSTRAP_ADMIN_KEY: "${OMNIKV_BOOTSTRAP_ADMIN_KEY:?set OMNIKV_BOOTSTRAP_ADMIN_KEY to a different strong 32+ character value}"

# Cluster notes:
# - Each node is a Raft member: OMNIKV_NODE_ID + OMNIKV_RAFT_ADDR must
#   BOTH be set (the config validator refuses a half-configured cluster).
# - All nodes use the SAME internal raft port (9090) on the PRIVATE
#   compose network; the ports are NOT published to the host — nothing
#   off-network ever needs them (Prometheus scrapes HTTPS 8443).
# - OMNIKV_RAFT_ADDR is the BIND address (0.0.0.0 inside the container);
#   OMNIKV_RAFT_ADVERTISE_ADDR is what peers DIAL (the compose hostname).
#   Without the advertise split, node 1 would register 0.0.0.0:9090 in
#   cluster membership and peers would dial THEMSELVES trying to reach
#   it after any failover/rejoin.
# - Node 1 initializes the cluster with the full initial membership
#   (itself + OMNIKV_RAFT_PEERS in order → node ids 2..); nodes 2/3
#   start blank and join as the leader's replication reaches them.
# - Consensus traffic is plaintext HTTP on the dedicated raft port
#   (etcd's peer-port model) — mTLS for peer traffic is not implemented yet.
services:
  omni-node-1:
    build: .
    container_name: omni-node-1
    ports:
      - "8443:8443"   # HTTP/2 REST API
      - "4433:4433"   # QUIC/HTTP3
      - "5433:5433"   # PostgreSQL Wire Protocol
    volumes:
      - omni-data-1:/data
    environment:
      <<: *omnikv-common-env
      OMNIKV_NODE_ID: "1"
      OMNIKV_RAFT_ADDR: "0.0.0.0:9090"
      OMNIKV_RAFT_ADVERTISE_ADDR: "omni-node-1:9090"
      OMNIKV_RAFT_PEERS: "omni-node-2:9090,omni-node-3:9090"
      OMNIKV_MANIFEST_PATH: "/data/manifest.json"
      OMNIKV_WAL_PATH: "/data/wal.bin"
      RUST_LOG: "${RUST_LOG:-info}"
    networks:
      - omni-cluster
    restart: unless-stopped

  omni-node-2:
    build: .
    container_name: omni-node-2
    ports:
      - "8444:8443"
      - "4434:4433"
      - "5434:5433"
    volumes:
      - omni-data-2:/data
    environment:
      <<: *omnikv-common-env
      OMNIKV_NODE_ID: "2"
      OMNIKV_RAFT_ADDR: "0.0.0.0:9090"
      OMNIKV_RAFT_ADVERTISE_ADDR: "omni-node-2:9090"
      # Only node 1's peer list is consumed (initial membership);
      # nodes 2/3 join as the leader replicates to them.
      OMNIKV_RAFT_PEERS: "omni-node-1:9090,omni-node-3:9090"
      OMNIKV_MANIFEST_PATH: "/data/manifest.json"
      OMNIKV_WAL_PATH: "/data/wal.bin"
      RUST_LOG: "${RUST_LOG:-info}"
    networks:
      - omni-cluster
    restart: unless-stopped

  omni-node-3:
    build: .
    container_name: omni-node-3
    ports:
      - "8445:8443"
      - "4435:4433"
      - "5435:5433"
    volumes:
      - omni-data-3:/data
    environment:
      <<: *omnikv-common-env
      OMNIKV_NODE_ID: "3"
      OMNIKV_RAFT_ADDR: "0.0.0.0:9090"
      OMNIKV_RAFT_ADVERTISE_ADDR: "omni-node-3:9090"
      OMNIKV_RAFT_PEERS: "omni-node-1:9090,omni-node-2:9090"
      OMNIKV_MANIFEST_PATH: "/data/manifest.json"
      OMNIKV_WAL_PATH: "/data/wal.bin"
      RUST_LOG: "${RUST_LOG:-info}"
    networks:
      - omni-cluster
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: omni-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - omni-cluster

  grafana:
    image: grafana/grafana:latest
    container_name: omni-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    networks:
      - omni-cluster

volumes:
  omni-data-1:
  omni-data-2:
  omni-data-3:

networks:
  omni-cluster:
    driver: bridge
