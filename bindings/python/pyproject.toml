[build-system]
requires = ["maturin>=1.14,<2"]
build-backend = "maturin"

[project]
name = "omnikv"
version = "0.4.0"
description = "Python/native bridge for OmniKV's embedded storage API"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{ name = "Balavignesh" }]
keywords = ["database", "kv", "embedded", "lsm", "rust"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Database",
]

[project.urls]
Repository = "https://github.com/SBALAVIGNESH123/OmniKV"
Issues = "https://github.com/SBALAVIGNESH123/OmniKV/issues"

[tool.maturin]
bindings = "pyo3"
module-name = "omnikv"
manifest-path = "Cargo.toml"
