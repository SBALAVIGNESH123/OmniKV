[package]
name = "omnikv-engine"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "OmniKV storage engine — LSM-tree, WAL, SQL, transactions, Raft consensus"

[dependencies]
memmap2 = "0.9.10"
tokio = { version = "1.52.1", features = ["full", "macros"] }
crossbeam-skiplist = "0.1.3"
arc-swap = "1.6.0"
crc32fast = "1.4.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1.44"
hdrhistogram = "7.5.4"
lz4_flex = "0.13.0"
moka = { version = "0.12", features = ["sync"] }
toml = "0.8"
regex = "1.11"
tempfile = "3.15"
openraft = { version = "0.9.24", features = ["serde"] }
reqwest = { version = "0.13.3", features = ["json"] }
prometheus = "0.14.0"
lazy_static = "1.5.0"
rand = "0.10.1"

[dev-dependencies]
tempfile = "3.15"
