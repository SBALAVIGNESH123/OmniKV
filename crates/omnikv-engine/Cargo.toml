[package]
name = "omnikv-engine"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "OmniKV embeddable storage, SQL, transaction, and Raft engine."

[lib]
name = "omni_engine"
path = "src/lib.rs"

[features]
default = []
failpoints = []

[dependencies]
memmap2 = "0.9.11"
tokio = { version = "1.52.1", features = ["full", "macros"] }
crossbeam-skiplist = "0.1.3"
arc-swap = "1.6.0"
crc32fast = "1.4.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1.44"
opentelemetry = "0.22.0"
tracing-opentelemetry = "0.23.0"
opentelemetry_sdk = "0.22.1"
hdrhistogram = "7.5.4"
tower_governor = "0.4.2"
reqwest = { version = "0.13.3", features = ["json"] }
lz4_flex = "0.13.0"
moka = { version = "0.12", features = ["sync"] }
toml = "0.8"
tar = "0.4.45"
flate2 = "1.1.9"
aes-gcm = "0.10.3"
rand = "0.10.1"
base64 = "0.22.1"
pbkdf2 = "0.13.0"
hmac = "0.13.0"
sha2 = "0.11.0"
prometheus = "0.14.0"
lazy_static = "1.5.0"
argon2 = "0.5.3"
password-hash = "0.6.1"
regex = "1.11"
openraft = { version = "0.9.24", features = ["serde"] }

[dev-dependencies]
tempfile = "3.15"

[[bench]]
name = "omni_bench"
path = "benches/omni_bench.rs"
harness = false
