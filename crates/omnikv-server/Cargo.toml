[package]
name = "omnikv-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "OmniKV network server for REST, QUIC, TCP, and PostgreSQL wire protocol endpoints."

[dependencies]
omni_engine = { package = "omnikv-engine", path = "../omnikv-engine" }
tokio = { version = "1.52.1", features = ["full", "macros"] }
axum = { version = "0.7.5", features = ["macros"] }
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
tower-http = { version = "0.5.2", features = ["cors"] }
quinn = "0.11.9"
rustls = { version = "0.23.40", features = ["ring"] }
webpki-roots = "0.26"
rcgen = "0.14.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
jsonwebtoken = { version = "10.4.0", default-features = false, features = ["aws_lc_rs"] }
base64 = "0.22.1"
hmac = "0.13.0"
sha2 = "0.11.0"
openraft = { version = "0.9.24", features = ["serde"] }

[dev-dependencies]
tempfile = "3.15"
tower = { version = "0.5", features = ["util"] }

[[bin]]
name = "omnikv-server"
path = "src/main.rs"
